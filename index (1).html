<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}

.slide.active{opacity:1;visibility:visible}
.tag{color:var(--ac);font-size:clamp(13px,1.5vw,22px);letter-spacing:.1em;text-transform:uppercase;font-weight:600}

ul{list-style:none;display:flex;flex-direction:column;gap:1.4vh;justify-content:center}
li{font-size:clamp(16px,2.1vw,34px);line-height:1.35;padding:1.3vh 1.3vw;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:8px}

.vt{color:var(--mu);font-size:.72em;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:1vh}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mu);font-weight:600;font-size:.8em;padding:.6vh .6vw;border-bottom:2px solid var(--ac)}
td{padding:.9vh .6vw;border-bottom:1px solid var(--bd)}tr:last-child td{border-bottom:0}

.fl{display:flex;flex-direction:column;align-items:stretch;gap:.5vh}
.fl span{background:var(--soft);border-radius:8px;padding:1vh 1vw;text-align:center}

.tl b{color:var(--ac);margin-right:.6em}
.br{display:flex;align-items:center;gap:.8vw;margin:.9vh 0}

.br div{height:2.6vh;background:var(--ac);border-radius:4px;min-width:3px}
.br b{font-weight:600}
.cap{color:var(--mu);font-size:.8em;margin-top:1vh;line-height:1.3}
.phy{background:var(--soft);border-radius:10px;padding:1.4vh 1.4vw;font-size:clamp(14px,1.7vw,26px);line-height:1.4}

.slide.active .a{animation:up .5s both}
.slide.active .a1{animation-delay:.03s}.slide.active .a2{animation-delay:.12s}.slide.active .a3{animation-delay:.22s}.slide.active .a4{animation-delay:.32s}.slide.active .a5{animation-delay:.42s}.slide.active .a6{animation-delay:.52s}

#top{position:fixed;right:1.2vw;top:1.6vh;display:flex;gap:.8vw;align-items:center;z-index:20}

.btn{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:1vh 1.4vw;font-size:clamp(13px,1.5vw,22px);cursor:pointer;touch-action:manipulation}

.acts{display:flex;gap:1.2vw;flex-wrap:wrap;margin-top:1.2vh}

.qt{font-size:clamp(20px,3vw,44px);line-height:1.3}
.qn{color:var(--ac);font-size:clamp(14px,1.7vw,26px);font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 1.6vw}
.opt{text-align:left;font:inherit;font-size:clamp(16px,2.1vw,32px);color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:2vh 1.4vw;cursor:pointer;touch-action:manipulation}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.ok{background:#e4f5ec;border-color:var(--ok)}
.opt.no{background:#fbe9e9;border-color:var(--no)}
.opt:disabled{cursor:default;color:var(--tx)}
.fill{display:flex;gap:1.2vw;flex-wrap:wrap}
.fill input{flex:1;min-width:200px;font:inherit;font-size:clamp(20px,2.6vw,40px);padding:1.4vh 1.2vw;border-radius:8px;border:2px solid var(--bd);background:#fff;color:var(--tx);user-select:text}
.fb{padding:1.6vh 1.6vw;border-radius:10px;font-size:clamp(15px,1.9vw,30px);line-height:1.35;border:1px solid var(--bd);background:var(--card)}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--no)}
.score{font-size:clamp(50px,9vw,130px);font-weight:700;color:var(--ac);line-height:1}

.rv .ok{border-left-color:var(--ok)}.rv .no{border-left-color:var(--no)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

1:W('Zaman çizelgesi',TL([['2005','SANAEM kuruldu (TAEK dönemi)'],['2012','Proton Hızlandırıcı Tesisi kuruldu'],['2018','NATEN kuruldu'],['2020','TENMAK kuruldu']])),
2:W('Üç kurum, tek çatı',F(['Türkiye Atom Enerjisi Kurumu','Ulusal Bor Araştırma Enstitüsü','Nadir Toprak Elementleri Araştırma Enstitüsü','<b>TENMAK</b>'])),
3:W('Enstitüler',T(['Enstitü','Alan'],[['Bor','Bor ürünleri ve teknolojileri'],['NATEN','Nadir toprak elementleri'],['Enerji','Enerji'],['NÜKEN','Nükleer enerji'],['Temiz Enerji','Temiz enerji']])),
4:W('Enerji dönüşüm zincirleri',F(['Çekirdek enerjisi','Isı','Hareket','Elektrik'])+'<div style="height:1.5vh"></div>'+F(['Işık (güneş paneli)','Elektrik'])),
5:W('Santralde enerji zinciri',T(['Aşama','Görev'],[['Çekirdek tepkimesi','Isı açığa çıkar'],['Buhar','Türbini döndürür'],['Türbin','Jeneratörü çevirir'],['Jeneratör','Elektrik üretir']])),
6:W('Ölçülen radyoizotoplar',T(['İzotop','Element'],[['Ra-226','Radyum'],['Th-232','Toryum'],['Cs-137','Sezyum'],['K-40','Potasyum']])+'<div class="cap">Su, toprak, gıda ve çevre örneklerinde analiz yapılır.</div>'),
7:W('Elektrik alanda proton','<svg viewBox="0 0 320 140" width="100%"><rect x="20" y="15" width="10" height="110" fill="#d65454"/><rect x="290" y="15" width="10" height="110" fill="#0e7c86"/><text x="25" y="10" text-anchor="middle" font-size="14" fill="#d65454">+</text><text x="295" y="10" text-anchor="middle" font-size="14" fill="#0e7c86">−</text><g stroke="#9aa6b2" stroke-width="1.5"><line x1="45" y1="40" x2="275" y2="40"/><line x1="45" y1="100" x2="275" y2="100"/></g><circle cx="130" cy="70" r="16" fill="#e8f3f4" stroke="#0e7c86" stroke-width="2"/><text x="130" y="76" text-anchor="middle" font-size="18" fill="#0e7c86">+</text><line x1="156" y1="70" x2="240" y2="70" stroke="#0e7c86" stroke-width="3"/><path d="M240 62l14 8-14 8z" fill="#0e7c86"/></svg><div class="cap">Pozitif yüklü proton, elektrik alan yönünde kuvvet görür ve hızlanır.</div>'),
8:W('Yerli üretim akışı',F(['Hızlandırıcıda üretim','Kalite kontrol','Hastaya uygun doz','Teşhis ve görüntüleme'])),
9:W('Mesafe ve ışıma şiddeti',B([['1 birim',100],['2 birim',25],['3 birim',11],['4 birim',6]],'%')+'<div class="cap">Nokta kaynakta şiddet mesafenin karesiyle ters orantılı azalır (1/d²). Değerler 1 birimdeki şiddete göredir.</div>'),
10:W('Ham maddeden ürüne',F(['Bor (ham madde)','Ar-Ge','Katma değerli ürün'])),
11:W('Mıknatıs ve kritik madde',T(['Alan','Rol'],[['Elektrik motoru','Güçlü mıknatıs'],['Rüzgâr türbini','Güçlü mıknatıs'],['Savunma sanayisi','Kritik malzeme']])),
12:W('Enerji dönüşümü',T(['Kaynak','Dönüşüm'],[['Güneş','Işık → elektrik'],['Rüzgâr','Hareket → elektrik'],['Nükleer','Çekirdek → ısı → elektrik']])),
13:W('Destek verilen taraflar',F(['Üniversite','Kamu','Özel sektör','<b>Proje destek programları</b>'])),
14:W('Özet tablo',T(['Alan','Örnek çalışma'],[['Nükleer','Cyclone-30 proton hızlandırıcı'],['Nükleer tıp','Yerli radyoizotop üretimi'],['Bor','Nötron yutma özelliği'],['Nadir toprak','Eskişehir Beylikova'],['Temiz enerji','Toryum çalışmaları']]))
};
function build(){
 var h="";
 S.forEach(function(s,i){
  var li=s.p.map(function(x,j){return '<li class="a a'+(j+2)+'">'+x+'</li>'}).join("");
  var ex=s.x?'<div class="acts a a6"><button class="btn pri" id="goQ">Sınava Başla</button><button class="btn" id="goR">Kaynakça</button></div>':"";
  h+='<section class="slide" id="s'+i+'"><div class="tag a a1">'+s.g+'</div><h1 class="a a1">'+s.t+'</h1><div class="main"><ul>'+li+'</ul><div class="side">'+(V[i]||"")+'<div class="phy a a4"><b>Fizik 9 bağlantısı</b>'+s.f+'</div>'+ex+'</div></div></section>';
 });
 h+='<section class="slide" id="s'+N+'"><div class="tag">Sınav</div><div class="qbox" id="qb"></div></section>';
 stage.innerHTML=h;
 document.getElementById("refList").innerHTML=R.map(function(r){return '<li>'+r[0]+'<br><a href="'+r[1]+'" target="_blank" rel="noopener">'+r[1]+'</a></li>'}).join("");
}
function show(n){
 n=Math.max(0,Math.min(N,n));
 var all=stage.children;
 for(var i=0;i<all.length;i++){all[i].classList.remove("active","prev");if(i<n)all[i].classList.add("prev");}
 all[n].classList.add("active");
 cur=n;
 cnt.textContent=n===N?"Sınav":(n+1)+" / "+N;
 bar.style.width=(n===N?100:(n+1)/N*100)+"%";
 if(n===N){qi=0;score=0;log=[];renderQ();}
}
function next(){if(cur<N-1)show(cur+1);}
function prev(){if(cur>0&&cur<=N-1)show(cur-1);}
function norm(s){return s.toLocaleLowerCase("tr").replace(/[.\s]+$/,"").trim();}
function renderQ(){
 var b=document.getElementById("qb"),q=Q[qi],h='<div class="qn">Soru '+(qi+1)+' / '+Q.length+' · '+(q.k==="f"?"Boşluk doldurma":"Çoktan seçmeli")+' · 20 puan</div><div class="qt">'+q.q+'</div>';
 locked=false;
 if(q.k==="f"){h+='<div class="fill"><input id="fi" type="text" autocomplete="off" placeholder="Cevabını yaz" aria-label="Cevap"><button class="btn pri" id="chk">Kontrol Et</button></div>';}
 else{h+='<div class="opts">'+q.o.map(function(o,i){return '<button class="opt" data-i="'+i+'">'+"ABCD"[i]+") "+o+'</button>'}).join("")+'</div>';}
 h+='<div id="fb"></div>';
 b.innerHTML=h;
 if(q.k==="f"){var fi=document.getElementById("fi");document.getElementById("chk").onclick=function(){if(!locked)finish(norm(fi.value)!==""&&q.a.indexOf(norm(fi.value))>-1,fi.value||"(boş)");};fi.onkeydown=function(e){e.stopPropagation();if(e.key==="Enter")document.getElementById("chk").click();};}
 else{[].forEach.call(b.querySelectorAll(".opt"),function(el){el.onclick=function(){if(locked)return;var i=+el.dataset.i;finish(i===q.c,q.o[i]);};});}
}
function finish(ok,given){
 locked=true;var q=Q[qi];
 if(ok)score+=20;
 log.push({ok:ok,given:given});
 var b=document.getElementById("qb");
 if(q.k==="f"){document.getElementById("fi").disabled=true;document.getElementById("chk").disabled=true;}
 else{[].forEach.call(b.querySelectorAll(".opt"),function(el,i){el.disabled=true;if(i===q.c)el.classList.add("ok");else if(el.dataset.i==q.o.indexOf(given)&&!ok)el.classList.add("no");});}
 var correct=q.k==="f"?q.ans:q.o[q.c];
 var last=qi===Q.length-1;
 document.getElementById("fb").innerHTML='<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"Doğru! +20 puan":"Yanlış. Doğru cevap: "+correct)+'</b><br>'+q.e+'</div><div class="acts"><button class="btn pri" id="nx">'+(last?"Sonucu Gör":"Sonraki Soru")+'</button></div>';
 document.getElementById("nx").onclick=function(){if(last)result();else{qi++;renderQ();}};
}
function result(){
 var t=score>=90?"Bilim Elçisi":score>=60?"Araştırmacı":"Meraklı Kâşif";
 var rv=Q.map(function(q,i){var l=log[i];return '<div class="'+(l.ok?"ok":"no")+'">'+(i+1)+'. '+(l.ok?"Doğru · ":"Yanlış · ")+(q.k==="f"?q.ans:q.o[q.c])+' — '+q.e+'</div>'}).join("");
 document.getElementById("qb").innerHTML='<div class="qn">Sınav tamamlandı</div><div><span class="score">'+score+'</span><span class="qt"> / 100 puan</span></div><div class="qt">'+t+'</div><div class="rv">'+rv+'</div><div class="acts"><button class="btn pri" id="again">Tekrar Çöz</button><button class="btn" id="back">Sunuya Dön</button><button class="btn" id="rf">Kaynakça</button></div>';
 document.getElementById("again").onclick=function(){qi=0;score=0;log=[];renderQ();};
 document.getElementById("back").onclick=function(){show(N-1);};
 document.getElementById("rf").onclick=openRefs;
}
function openRefs(){document.getElementById("refs").classList.add("show");}
function closeRefs(){document.getElementById("refs").classList.remove("show");}
function fs(){var d=document,e=d.documentElement;try{if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}else{(e.requestFullscreen||e.webkitRequestFullscreen).call(e);}}catch(x){}}
function fsLabel(){document.getElementById("bFs").textContent=(document.fullscreenElement||document.webkitFullscreenElement)?"Tam ekrandan çık":"Tam ekran";}
build();show(0);
document.getElementById("goQ").onclick=function(){show(N);};
document.getElementById("goR").onclick=openRefs;
document.getElementById("bRef").onclick=openRefs;
document.getElementById("refClose").onclick=closeRefs;
document.getElementById("bFs").onclick=fs;
document.addEventListener("fullscreenchange",fsLabel);document.addEventListener("webkitfullscreenchange",fsLabel);
document.addEventListener("click",function(e){if(e.target.tagName==="BUTTON")e.target.blur();});
stage.addEventListener("click",function(e){
 if(cur===N)return;
 if(e.target.closest("button,input,a,.noNav"))return;
 if(e.clientX>window.innerWidth/2)next();else prev();
});
document.addEventListener("keydown",function(e){
 var t=e.target.tagName;
 if(t==="INPUT"||t==="TEXTAREA")return;
 if(e.key==="Escape"){closeRefs();return;}
 if(document.getElementById("refs").classList.contains("show"))return;
 if(e.key==="f"||e.key==="F"){fs();return;}
 if(cur===N){if(e.key==="ArrowLeft"||e.key==="Home"){}else return;}
 if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();next();}
 else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();if(cur===N&&!locked&&qi>0){}else if(cur===N){show(N-1);}else prev();}
 else if(e.key===" "){if(t==="BUTTON")return;e.preventDefault();next();}
 else if(e.key==="Home"){e.preventDefault();show(0);}
 else if(e.key==="End"){e.preventDefault();show(N-1);}
});
</script>
</body>
</html>
